<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Login & Autentikasi - SerComp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-slate-200 p-8 space-y-6">
    <!-- Header Logo -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 mx-auto rounded-2xl bg-blue-900 flex items-center justify-center text-white font-extrabold text-xl shadow-md">
        SC
      </div>
      <h1 class="text-2xl font-extrabold text-blue-950">Masuk ke SerComp</h1>
      <p class="text-xs text-slate-500">Lacak servis, setujui estimasi biaya & klaim garansi digital</p>
    </div>

    <!-- Toggle Role: Pelanggan / Mitra Teknisi -->
    <div class="grid grid-cols-2 p-1 bg-slate-100 rounded-xl text-xs font-bold text-center">
      <button class="py-2 rounded-lg bg-white text-blue-950 shadow-sm">Pelanggan</button>
      <button class="py-2 rounded-lg text-slate-500 hover:text-slate-800">Mitra Teknisi</button>
    </div>

    <!-- Quick Social Login -->
    <div class="space-y-2.5">
      <button class="w-full py-2.5 px-4 border border-slate-300 rounded-xl text-xs font-bold text-slate-700 hover:bg-slate-50 flex items-center justify-center gap-2.5 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
        <span>Lanjutkan dengan Google</span>
      </button>

      <button class="w-full py-2.5 px-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs font-bold hover:bg-emerald-100 flex items-center justify-center gap-2 transition">
        <span>💬 Masuk Cepat via WhatsApp OTP</span>
      </button>
    </div>

    <!-- Divider -->
    <div class="relative flex py-1 items-center">
      <div class="flex-grow border-t border-slate-200"></div>
      <span class="flex-shrink mx-3 text-[10px] text-slate-400 font-semibold uppercase">atau email</span>
      <div class="flex-grow border-t border-slate-200"></div>
    </div>

    <!-- Form Email / Password -->
    <form class="space-y-3.5 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Email / No. Handphone</label>
        <input type="text" placeholder="nama@kampus.ac.id" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-900 focus:outline-none">
      </div>

      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="font-semibold text-slate-700">Kata Sandi</label>
          <a href="#" class="text-[11px] text-teal-600 hover:underline">Lupa sandi?</a>
        </div>
        <input type="password" value="••••••••" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-900 focus:outline-none">
      </div>

      <button type="button" class="w-full mt-2 py-3 bg-blue-900 hover:bg-blue-800 text-white font-bold text-xs rounded-xl shadow transition">
        Masuk ke Akun
      </button>
    </form>

    <div class="text-center text-[11px] text-slate-500 pt-2 border-t">
      Belum punya akun SerComp? <a href="#" class="text-blue-900 font-bold hover:underline">Daftar Akun Baru</a>
    </div>
  </div>

</body>
</html>
