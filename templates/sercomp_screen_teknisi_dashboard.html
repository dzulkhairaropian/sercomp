<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Layar Dashboard Mitra Teknisi - SerComp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-12">

  <!-- Mobile Top Nav Teknisi -->
  <header class="bg-blue-950 text-white px-4 py-3 sticky top-0 z-50 flex items-center justify-between shadow-md">
    <div class="flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-lg bg-teal-500 text-blue-950 font-black flex items-center justify-center text-xs">TECH</div>
      <div>
        <p class="text-xs font-bold leading-tight">Agus Prasetyo</p>
        <span class="text-[10px] text-teal-400 font-medium">Teknisi Level 3 • Workshop Grogol</span>
      </div>
    </div>
    <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full border border-emerald-500/30 font-semibold">
      Status: Online
    </span>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-5 space-y-4">
    <!-- Ringkasan Pekerjaan Hari Ini -->
    <div class="grid grid-cols-3 gap-2 text-center text-xs">
      <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
        <p class="text-lg font-extrabold text-blue-950">2</p>
        <p class="text-[10px] text-slate-500">Antrean Baru</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
        <p class="text-lg font-extrabold text-amber-600">1</p>
        <p class="text-[10px] text-slate-500">Proses Servis</p>
      </div>
      <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm">
        <p class="text-lg font-extrabold text-emerald-600">Rp 520k</p>
        <p class="text-[10px] text-slate-500">Bagi Hasil Hari Ini</p>
      </div>
    </div>

    <!-- Active Job Card / Form Diagnosa Input Teknisi -->
    <div class="bg-white rounded-2xl border-2 border-teal-500 shadow-md p-5 space-y-4">
      <div class="flex justify-between items-start border-b pb-3">
        <div>
          <span class="text-[10px] bg-amber-100 text-amber-800 font-bold px-2 py-0.5 rounded">Sedang Dikerjakan</span>
          <h2 class="text-sm font-extrabold text-blue-950 mt-1">#SC-2026-JKT-0982</h2>
          <p class="text-xs text-slate-600">Asus Vivobook 14 (A412DA) • Keluhan: Mati Total</p>
        </div>
        <button class="text-xs bg-slate-100 text-slate-700 px-2.5 py-1 rounded-lg font-semibold hover:bg-slate-200">
          Detail Customer
        </button>
      </div>

      <!-- Action: Upload Foto Mikroskop Hardware -->
      <div class="space-y-1.5">
        <label class="block text-xs font-bold text-slate-700">1. Bukti Foto Diagnosa Mikroskop</label>
        <div class="grid grid-cols-2 gap-2">
          <div class="border border-slate-200 rounded-xl p-2 bg-slate-50 text-center text-[10px]">
            <div class="w-full h-20 bg-slate-200 rounded-lg flex items-center justify-center font-mono text-slate-400">
              [ Foto IC Rusak ]
            </div>
            <p class="mt-1 font-semibold text-slate-600">ic_power_burn.jpg</p>
          </div>
          <button class="border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center p-3 text-slate-500 hover:bg-slate-50">
            <span class="text-lg">+</span>
            <span class="text-[10px] font-semibold">Ambil Foto Baru</span>
          </button>
        </div>
      </div>

      <!-- Action: Input Suku Cadang & Biaya Jasa -->
      <div class="space-y-2">
        <label class="block text-xs font-bold text-slate-700">2. Rincian Part & Jasa Tambahan</label>
        <div class="space-y-1.5 text-xs">
          <div class="flex gap-2">
            <input type="text" value="Jasa Solder Micro IC" class="w-2/3 p-2 bg-slate-50 border rounded-lg text-xs">
            <input type="text" value="Rp 150.000" class="w-1/3 p-2 bg-slate-50 border rounded-lg text-xs font-mono text-right">
          </div>
          <div class="flex gap-2">
            <input type="text" value="IC Regulator Asus Ori" class="w-2/3 p-2 bg-slate-50 border rounded-lg text-xs">
            <input type="text" value="Rp 120.000" class="w-1/3 p-2 bg-slate-50 border rounded-lg text-xs font-mono text-right">
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-3 border-t grid grid-cols-2 gap-2">
        <button class="py-2.5 bg-blue-900 hover:bg-blue-800 text-white font-bold text-xs rounded-xl shadow">
          Kirim Estimasi ke User
        </button>
        <button class="py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow">
          Selesai & Cetak E-Garansi
        </button>
      </div>
    </div>
  </main>

</body>
</html>
